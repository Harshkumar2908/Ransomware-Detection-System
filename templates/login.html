<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .login-box{
            background:#1e293b;
            padding:40px;
            border-radius:20px;
            width:350px;
            text-align:center;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        h1{
            color:#38bdf8;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            margin-top:20px;
            padding:12px 30px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        .error{
            color:red;
            margin-top:15px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
